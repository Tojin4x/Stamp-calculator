<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คิดราคาตรายาง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE6D6;
    --paper-deep: #E2D9C4;
    --ink: #23262E;
    --ink-navy: #2B2A4A;
    --stamp-red: #B4222A;
    --stamp-red-dim: #8f1c22;
    --line-soft: rgba(35,38,46,0.16);
    --card: #F6F1E6;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 10% 15%, rgba(0,0,0,0.035) 0, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(0,0,0,0.035) 0, transparent 40%);
    color: var(--ink);
    font-family: 'IBM Plex Sans Thai', sans-serif;
    min-height: 100vh;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  header{
    text-align:center;
    margin-bottom: 32px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--stamp-red);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1{
    font-family: 'Special Elite', monospace;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: 0.02em;
    color: var(--ink-navy);
    margin: 0 0 8px;
    transform: rotate(-0.6deg);
  }
  .sub{
    color: #5b5648;
    font-size: 14px;
    max-width: 420px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 12px 24px -18px rgba(35,38,46,0.35);
    padding: 28px;
    margin-bottom: 20px;
  }
  .field-row{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  label{
    display:block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6455;
    margin-bottom: 8px;
  }
  input[type=number]{
    width: 100%;
    padding: 12px 14px;
    font-size: 20px;
    font-family: 'IBM Plex Mono', monospace;
    background: #fff;
    border: 1.5px solid var(--line-soft);
    border-radius: 3px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  input[type=number]:focus{
    border-color: var(--stamp-red);
  }
  button{
    margin-top: 22px;
    width: 100%;
    padding: 15px;
    background: var(--ink-navy);
    color: #F6F1E6;
    border: none;
    border-radius: 3px;
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }
  button:hover{ background: #38375f; }
  button:active{ transform: scale(0.98); }

  .error{
    color: var(--stamp-red);
    font-size: 13px;
    margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    display:none;
  }

  #result{ display:none; }

  .real-size{
    text-align:center;
    font-family: 'IBM Plex Mono', monospace;
    color: #6a6455;
    font-size: 13px;
    margin-bottom: 18px;
    letter-spacing: 0.03em;
  }

  .size-diagram{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
    margin: 4px 0 24px;
  }
  .size-diagram svg{ display:block; width: 100%; max-width: 320px; }
  .size-legend{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--ink);
  }
  .legend-swatch{
    width: 20px;
    height: 20px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .stamp-stage{
    position: relative;
    display:flex;
    justify-content:center;
    padding: 10px 0 26px;
  }
  .stamp-mark{
    position: relative;
    border: 3px solid var(--stamp-red);
    border-radius: 6px;
    padding: 18px 30px;
    text-align:center;
    transform: rotate(-3deg) scale(0.4);
    opacity: 0;
    color: var(--stamp-red);
    mix-blend-mode: multiply;
  }
  .stamp-mark.show{
    animation: thump .38s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes thump{
    0%{ transform: rotate(-3deg) scale(0.4); opacity:0; }
    55%{ transform: rotate(-3deg) scale(1.12); opacity:1; }
    75%{ transform: rotate(-3deg) scale(0.95); }
    100%{ transform: rotate(-3deg) scale(1); opacity:1; }
  }
  .stamp-mark::before{
    content:"";
    position:absolute;
    inset: 5px;
    border: 1px solid var(--stamp-red);
    border-radius: 3px;
    opacity: 0.6;
  }
  .stamp-code{
    font-family: 'Special Elite', monospace;
    font-size: 30px;
    letter-spacing: 0.05em;
  }
  .stamp-dims{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .price-row{
    display:flex;
    justify-content:center;
    gap: 28px;
    text-align:center;
    margin-bottom: 14px;
  }
  .price-block .amount{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink-navy);
  }
  .price-block .label{
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8b8680;
    margin-top: 2px;
  }

  .reason{
    text-align:center;
    font-size: 13px;
    color: #6a6455;
    padding-top: 10px;
    border-top: 1px dashed var(--line-soft);
  }

  .options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 20px;
  }
  .opt{
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    padding: 14px;
    background: #fbf8f0;
  }
  .opt .tag{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--stamp-red);
    margin-bottom: 6px;
  }
  .opt .code{
    font-family: 'Special Elite', monospace;
    font-size: 18px;
    color: var(--ink-navy);
  }
  .opt .dims{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #6a6455;
    margin: 2px 0 8px;
  }
  .opt .price{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
  }
  .opt.selected{
    border-color: var(--stamp-red);
    box-shadow: 0 0 0 1px var(--stamp-red) inset;
  }
  .opt.missing{
    grid-column: 1 / -1;
    display: block;
    text-align: left;
    color: #6a6455;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .opt.missing .missing-label{
    text-align:center;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    color: var(--stamp-red);
  }
  .ref-row-wrap .ref-row{ margin-bottom: 6px; }
  .ref-row-wrap .ref-cell{ padding: 5px 2px; }
  .ref-row-wrap .ref-cell .code{ font-size: 11px; }
  .ref-row-wrap .ref-cell .price{ font-size: 10px; }

  .ref-single-wrap{ text-align:center; }
  .ref-single-label{
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-weight: 700;
    color: var(--stamp-red);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .ref-single-box{
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 18px 10px;
    background: #fbf8f0;
  }
  .ref-single-code{
    font-family: 'Special Elite', monospace;
    font-size: 24px;
    color: var(--ink-navy);
  }
  .ref-single-price{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: var(--stamp-red);
    margin-top: 6px;
  }

  footer{
    text-align:center;
    font-size: 11px;
    color: #a39d8c;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 30px;
    letter-spacing: 0.04em;
  }

  .ref-toggle{
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line-soft);
    color: #6a6455;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 12px;
    margin: 0 0 20px;
    border-radius: 4px;
    cursor: pointer;
  }
  .ref-toggle:hover{ border-color: var(--stamp-red); color: var(--stamp-red); }

  #refTable{ display:none; }
  .ref-title{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6a6455;
    margin-bottom: 16px;
    text-align:center;
  }
  .ref-row{
    display:flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ref-cell{
    flex: 1;
    border: 1px solid var(--line-soft);
    border-radius: 3px;
    background: #fbf8f0;
    text-align:center;
    padding: 8px 4px;
  }
  .ref-cell .code{
    font-family: 'Special Elite', monospace;
    font-size: 13px;
    color: var(--ink-navy);
  }
  .ref-cell .price{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--stamp-red);
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ระบบคำนวณราคา</div>
    <h1>คิดราคาตรายาง</h1>
    <p class="sub">กรอกขนาดชิ้นงาน ระบบจะเลือกแท่นตรายางที่เหมาะสมและคำนวณราคาให้อัตโนมัติ</p>
  </header>

  <div class="card">
    <div class="field-row">
      <div>
        <label for="length">ความยาว (ซม.)</label>
        <input type="number" id="length" step="0.1" min="0" placeholder="0.0">
      </div>
      <div>
        <label for="width">ความกว้าง (ซม.)</label>
        <input type="number" id="width" step="0.1" min="0" placeholder="0.0">
      </div>
    </div>
    <button onclick="handleCalculate()">คำนวณราคา</button>
    <div class="error" id="err">⚠ กรุณากรอกตัวเลขความยาวและความกว้างให้ถูกต้อง</div>
  </div>

  <div class="card" id="result">
    <div class="real-size" id="realSize"></div>

    <div class="size-diagram" id="sizeDiagram"></div>

    <div class="stamp-stage">
      <div class="stamp-mark" id="stampMark">
        <div class="stamp-code" id="stampCode"></div>
        <div class="stamp-dims" id="stampDims"></div>
      </div>
    </div>

    <div class="price-row">
      <div class="price-block">
        <div class="amount" id="priceFull"></div>
        <div class="label">ราคาปกติ</div>
      </div>
      <div class="price-block">
        <div class="amount" id="priceCash"></div>
        <div class="label">เงินสด</div>
      </div>
    </div>

    <div class="reason" id="reasonText"></div>

    <div class="options" id="optionsGrid"></div>
  </div>

  <button class="ref-toggle" id="refToggleBtn" onclick="toggleRefTable()">☰ ดูตารางราคากลางทั้งหมด (รหัสแท่น × ราคา)</button>

  <div class="card" id="refTable">
    <div class="ref-title">ตารางราคากลาง</div>
    <div id="refTableBody"></div>
  </div>

  <footer>ราคาคำนวณจากตารางอ้างอิงแท่นตรายางมาตรฐาน</footer>
</div>

<script>
// ==================================================
// ตารางอ้างอิง (เก็บลำดับด้วย Map เพื่อไม่ให้ JS จัดเรียง key ตัวเลขใหม่)
// ==================================================
const REFERENCE_TABLE = new Map([
  [1.0, [[2.0,60],[3.7,70],[4.5,80],[5.5,90],[6.6,110],[8.0,140],[9.8,160]]],
  [1.5, [[2.0,70],[3.7,120],[4.5,140],[5.5,160],[6.6,180],[8.0,200],[9.8,240]]],
  [2.0, [[2.0,80],[3.7,140],[4.5,160],[5.5,180],[6.6,220],[8.0,280],[9.8,320]]],
  [2.5, [[2.5,100],[3.7,160],[4.5,200],[5.5,240],[7.0,300],[8.0,360],[9.8,400]]],
  [3.2, [[3.7,240],[4.5,260],[5.5,320],[7.0,390],[9.0,480]]],
  [4.0, [[4.5,350],[6.6,450],[9.0,590]]],
  [5.0, [[5.5,490],[6.6,560],[9.8,790]]],
]);

const STAMP_CODE_ROWS = [
  ["P1","P2","P3","Q1","Q2","Q3","R1"],
  ["P4","Q4","Q5","R2","R3","X1","X2"],
  ["P5","Q6","R4","R5","X3","X4","Y1"],
  ["Q7","R6","R7","X5","Y2","Y3","Z1"],
  ["X6","X7","Y4","Y5","Z2"],
  ["Y6","Z3","Z4"],
  ["Z5","Z6","Z7"],
];

// ==================================================
// helper
// ==================================================
function roundUp(value, steps){
  for (const s of steps) if (value <= s) return s;
  return steps[steps.length - 1];
}

function roundDown(value, steps){
  let prev = null;
  for (const s of steps){
    if (value < s) return prev;
    prev = s;
  }
  return prev;
}

function smartRound(price){
  const base = Math.floor(price);
  return (price - base > 0.5) ? base + 1 : base;
}

function canFitWithMargin(realW, realL, refW, refL){
  // กว้างต้อง "มากกว่า" ชิ้นงานเท่านั้น
  return refW > realW && refL >= realL;
}

// ==================================================
// map รหัสแท่น
// ==================================================
const STAMP_CODE_TABLE = new Map();
{
  const refEntries = Array.from(REFERENCE_TABLE.entries());
  refEntries.forEach(([refW, row], rowIdx) => {
    const codes = STAMP_CODE_ROWS[rowIdx] || [];
    row.forEach(([refL, _price], colIdx) => {
      const code = codes[colIdx];
      if (code) STAMP_CODE_TABLE.set(`${refW}_${refL}`, code);
    });
  });
}

function getStampCode(w, l){
  return STAMP_CODE_TABLE.get(`${w}_${l}`) || "N/A";
}

function getBasePrice(refW, refL){
  const row = REFERENCE_TABLE.get(refW);
  if (!row) return null;
  const entry = row.find(([l, _]) => l === refL);
  return entry ? entry[1] : null;
}

// ==================================================
// คำนวณราคา
// ==================================================
function calculatePrice(length, width, refW, refL){
  const row = REFERENCE_TABLE.get(refW);
  const idx = row.findIndex(([l, _]) => l === refL);

  const refPrice = row[idx][1];
  const prevPrice = idx > 0 ? row[idx - 1][1] : 0;

  const raw = (width * length) * (refPrice / (refW * refL));
  let final = smartRound(raw);

  if (idx > 0){
    final = Math.max(final, Math.ceil(prevPrice * 1.07));
  }

  return {
    refWidth: refW,
    refLength: refL,
    code: getStampCode(refW, refL),
    price: final,
    cash: smartRound(final * 0.85)
  };
}

// ==================================================
// คำนวณหลัก
// ==================================================
function compute(length, width){
  const widthSteps = Array.from(REFERENCE_TABLE.keys());

  // ---- ปัดขึ้น (ข้ามแท่นพอดี) ----
  let refWUp = roundUp(width, widthSteps);
  if (refWUp <= width){
    const idx = widthSteps.indexOf(refWUp);
    if (idx + 1 < widthSteps.length) refWUp = widthSteps[idx + 1];
  }
  const lengthStepsUp = REFERENCE_TABLE.get(refWUp).map(([l, _]) => l);
  const refLUp = roundUp(length, lengthStepsUp);
  const up = calculatePrice(length, width, refWUp, refLUp);

  // ---- ปัดลง (ต้องเผื่อฐาน) ----
  let down = null;
  const refWDown = roundDown(width, widthSteps);
  if (refWDown){
    const lengthStepsDown = REFERENCE_TABLE.get(refWDown).map(([l, _]) => l);
    const refLDown = roundDown(length, lengthStepsDown);
    if (refLDown && canFitWithMargin(width, length, refWDown, refLDown)){
      down = calculatePrice(length, width, refWDown, refLDown);
    }
  }

  // ---- เลือก ----
  let selected = up;
  let reason = "ใช้แท่นเผื่อขยายฐาน (ปลอดภัย)";

  if (down){
    const diff = (up.price - down.price) / up.price * 100;
    if (diff <= 10){
      selected = down;
      reason = `เลือกแท่นเล็กกว่า (ต่าง ${diff.toFixed(1)}%)`;
    }
  }

  return { up, down, selected, reason };
}

// ==================================================
// UI
// ==================================================
function handleCalculate(){
  const lengthInput = document.getElementById('length');
  const widthInput = document.getElementById('width');
  const err = document.getElementById('err');

  const length = parseFloat(lengthInput.value);
  const width = parseFloat(widthInput.value);

  if (!isFinite(length) || !isFinite(width) || length <= 0 || width <= 0){
    err.style.display = 'block';
    document.getElementById('result').style.display = 'none';
    return;
  }
  err.style.display = 'none';

  const { up, down, selected, reason } = compute(length, width);

  document.getElementById('realSize').textContent =
    `ขนาดจริง : ${width.toFixed(2)} × ${length.toFixed(2)} ซม.`;

  document.getElementById('sizeDiagram').innerHTML =
    buildSizeDiagram(width, length, selected.refWidth, selected.refLength);

  document.getElementById('stampCode').textContent = selected.code;
  document.getElementById('stampDims').textContent =
    `แท่น ${selected.refWidth} × ${selected.refLength}`;

  document.getElementById('priceFull').textContent = `฿${selected.price.toLocaleString()}`;
  document.getElementById('priceCash').textContent = `฿${selected.cash.toLocaleString()}`;
  document.getElementById('reasonText').textContent = `เหตุผล : ${reason}`;

  // options grid: up + down (if any)
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';

  const upIsSelected = selected === up;
  grid.appendChild(buildOptionCard('▲ ปัดขึ้น', up, upIsSelected));

  if (down){
    const downIsSelected = selected === down;
    grid.appendChild(buildOptionCard('▼ ปัดลง', down, downIsSelected));
  } else {
    const basePrice = getBasePrice(selected.refWidth, selected.refLength);
    const div = document.createElement('div');
    div.className = 'ref-single-wrap';
    div.innerHTML = `
      <div class="ref-single-label">ราคากลาง</div>
      <div class="ref-single-box">
        <div class="ref-single-code">${selected.code}</div>
        <div class="ref-single-price">฿${basePrice !== null ? basePrice.toLocaleString() : '-'}</div>
      </div>
    `;
    grid.appendChild(div);
  }

  const resultCard = document.getElementById('result');
  resultCard.style.display = 'block';

  // restart stamp animation
  const mark = document.getElementById('stampMark');
  mark.classList.remove('show');
  void mark.offsetWidth; // reflow to restart animation
  mark.classList.add('show');

  resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function buildOptionCard(tag, opt, isSelected){
  const div = document.createElement('div');
  div.className = 'opt' + (isSelected ? ' selected' : '');
  div.innerHTML = `
    <div class="tag">${tag}${isSelected ? ' · เลือกใช้' : ''}</div>
    <div class="code">${opt.code}</div>
    <div class="dims">แท่น ${opt.refWidth} × ${opt.refLength}</div>
    <div class="price">฿${opt.price.toLocaleString()} <span style="color:#8b8680;font-weight:400;">(เงินสด ฿${opt.cash.toLocaleString()})</span></div>
  `;
  return div;
}

// allow Enter key to trigger calculation
document.getElementById('width').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleCalculate();
});
document.getElementById('length').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleCalculate();
});

// ==================================================
// ตารางราคากลาง (รหัสแท่น + ราคาตั้งต้นจากตารางอ้างอิง)
// ==================================================
function buildRefTableHTML(){
  let html = '';
  const refEntries = Array.from(REFERENCE_TABLE.entries());
  refEntries.forEach(([refW, row], rowIdx) => {
    const codes = STAMP_CODE_ROWS[rowIdx] || [];
    html += '<div class="ref-row">';
    row.forEach(([refL, price], colIdx) => {
      const code = codes[colIdx] || 'N/A';
      html += `<div class="ref-cell"><div class="code">${code}</div><div class="price">฿${price.toLocaleString()}</div></div>`;
    });
    html += '</div>';
  });
  return html;
}

function buildSizeDiagram(realWidth, realLength, refWidth, refLength){
  const viewW = 300, viewH = 150, pad = 20;
  const availW = viewW - pad * 2;
  const availH = viewH - pad * 2;
  const scale = Math.min(availW / refLength, availH / refWidth);

  const outerW = refLength * scale;
  const outerH = refWidth * scale;
  const innerW = realLength * scale;
  const innerH = realWidth * scale;

  const outerX = (viewW - outerW) / 2;
  const outerY = (viewH - outerH) / 2;
  const innerX = outerX + (outerW - innerW) / 2;
  const innerY = outerY + (outerH - innerH) / 2;

  const svg = `
    <svg viewBox="0 0 ${viewW} ${viewH}">
      <rect x="${outerX.toFixed(1)}" y="${outerY.toFixed(1)}" width="${outerW.toFixed(1)}" height="${outerH.toFixed(1)}"
            fill="#e87ba3"/>
      <rect x="${innerX.toFixed(1)}" y="${innerY.toFixed(1)}" width="${innerW.toFixed(1)}" height="${innerH.toFixed(1)}"
            fill="#3ea677"/>
    </svg>`;

  const legend = `
    <div class="size-legend">
      <div class="legend-row"><span class="legend-swatch" style="background:#3ea677;"></span>${realLength.toFixed(2)} × ${realWidth.toFixed(2)} (ขนาดงาน)</div>
      <div class="legend-row"><span class="legend-swatch" style="background:#e87ba3;"></span>${refLength} × ${refWidth} (ขนาดแท่น)</div>
    </div>`;

  return svg + legend;
}

function renderRefTable(){
  document.getElementById('refTableBody').innerHTML = buildRefTableHTML();
}

function toggleRefTable(forceOpen){
  const table = document.getElementById('refTable');
  const btn = document.getElementById('refToggleBtn');
  const shouldShow = forceOpen === true || table.style.display !== 'block';
  table.style.display = shouldShow ? 'block' : 'none';
  btn.textContent = shouldShow ? '☰ ซ่อนตารางราคากลาง' : '☰ ดูตารางราคากลางทั้งหมด (รหัสแท่น × ราคา)';
  if (shouldShow) table.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

renderRefTable();
</script>
